name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: CI Audit & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Build production app
        run: npm run build
